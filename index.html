<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<meta name="description" content="HAM3D : atelier marocain de conception, modélisation et impression 3D. Prototypes, pièces sur mesure et petites séries à prix accessibles.">
<title>HAM3D – Atelier marocain d’impression 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--card:#121a2e;--card2:#18233d;--ink:#eef3ff;--mut:#9fb0d0;--blue:#2f7bff;--line:#24304d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 Barlow,Cairo,system-ui,sans-serif}
html[lang=ar] body,html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .logo{font-family:Cairo,sans-serif;letter-spacing:0}
h1,h2,h3{font-family:"Barlow Condensed",Cairo,sans-serif;margin:0;line-height:1.05}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
section{padding:72px 0}
h2{font-size:clamp(2rem,4.5vw,3rem);font-weight:800;margin-bottom:10px}
.sub{color:var(--mut);margin:0 0 34px;max-width:60ch}
header{position:sticky;top:0;z-index:20;background:rgba(10,15,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;align-items:center;gap:22px;height:66px}
.logo{font:800 1.9rem "Barlow Condensed",sans-serif;text-decoration:none;letter-spacing:.02em;margin-inline-end:auto}
.logo b{color:var(--blue)}
nav a.l{text-decoration:none;color:var(--mut);font-weight:500}
nav a.l:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:6px 11px;font:600 .85rem Barlow,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--blue);color:#fff}
.btn{display:inline-block;background:var(--blue);color:#fff;font:600 1rem Barlow,Cairo,sans-serif;padding:13px 26px;border-radius:8px;text-decoration:none;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.o{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
@media(max-width:820px){nav a.l{display:none}}
.hero{padding:54px 0 70px;background:radial-gradient(60% 70% at 78% 40%,rgba(47,123,255,.22),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.tag{display:inline-block;border:1px solid var(--line);color:var(--blue);padding:4px 14px;border-radius:99px;font-size:.9rem;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(3.2rem,8.5vw,6rem);font-weight:800;margin-bottom:18px}
.hero p{font-size:1.18rem;color:var(--mut);max-width:44ch;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.vase{width:100%;max-width:400px;margin:auto;filter:drop-shadow(0 0 28px rgba(47,123,255,.45))}
.vase .g{animation:gr 2.4s ease-out both}
@keyframes gr{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@media(prefers-reduced-motion:reduce){.vase .g{animation:none}html{scroll-behavior:auto}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.vase{max-width:280px}}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px;text-decoration:none;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;transition:border-color .2s}
.cat:hover{border-color:var(--blue)}
.cat h3{font-size:1.8rem;font-weight:700;margin-bottom:6px}
.cat p{margin:0;color:var(--mut)}
.cat span{color:var(--blue);font-weight:600;margin-top:12px}
@media(max-width:700px){.cats{grid-template-columns:1fr}}
.dev{background:var(--card);border-block:1px solid var(--line)}
.dev .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:start}
form{display:grid;gap:13px}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
textarea{min-height:110px;resize:vertical}
.note{font-size:.88rem;color:var(--mut);margin:0}
@media(max-width:820px){.dev .wrap{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.s h3{font-size:1.5rem;font-weight:700;margin-bottom:8px}
.s p{margin:0 0 14px;color:var(--mut);font-size:.98rem}
.s ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.s li{background:var(--card2);padding:3px 11px;border-radius:99px;font-size:.85rem;color:var(--mut)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.pick{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:26px}
.pick em{position:absolute;top:16px;inset-inline-end:16px;background:var(--blue);color:#fff;font-style:normal;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px}
.pick h3{font-size:1.55rem;font-weight:700;margin:26px 0 8px}
.pick p{margin:0;color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pills span{border:1px solid var(--line);background:var(--card);padding:12px 22px;border-radius:99px;font-weight:600}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.fl button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 18px;border-radius:99px;font:600 .95rem Barlow,Cairo,sans-serif;cursor:pointer}
.fl button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pc:hover{border-color:var(--blue)}
.th{aspect-ratio:4/3;background:radial-gradient(circle at 50% 40%,#1b2d57,var(--card2));display:grid;place-items:center}
.th svg{width:40%}
.pb{padding:18px;display:grid;gap:6px;flex:1;align-content:start}
.pb h3{font-size:1.4rem;font-weight:700}
.pb p{margin:0;color:var(--mut);font-size:.95rem}
.pr{font:800 1.5rem "Barlow Condensed",Cairo,sans-serif;color:var(--blue);margin-top:6px}
.pr small{font:500 .85rem Barlow,Cairo,sans-serif;color:var(--mut)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-width:520px;width:calc(100% - 32px);padding:28px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{font-size:2rem;margin-bottom:10px}
.sp{list-style:none;padding:0;margin:16px 0;display:grid;gap:6px;color:var(--mut)}
.sp b{color:var(--ink)}
.da{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ph{border-style:dashed;cursor:default;opacity:.7}.ph:hover{border-color:var(--line)}
.mk{padding-top:0}.mk .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.mk h2{font-size:clamp(2.2rem,5vw,3.4rem)}
.bf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bf div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.bf h3{font-size:1.4rem;font-weight:700;color:var(--blue);margin-bottom:6px}
.bf p{margin:0;color:var(--mut);font-size:.95rem}
@media(max-width:820px){.mk .wrap{grid-template-columns:1fr}}
.th img{width:100%;height:100%;object-fit:cover}
.so{color:#ff8a8a;font-weight:600;font-size:.9rem}
#gm{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--card2);display:block}
.gt{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}.gt button{padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;width:58px;height:58px;background:none;cursor:pointer}
.gt button img{width:100%;height:100%;object-fit:cover;display:block}.so.oo{color:#ffcf6b}
.strip{background:var(--blue);padding:22px 0}
.strip .wrap{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px;font:700 1.3rem "Barlow Condensed",Cairo,sans-serif}
footer{background:#060a14;border-top:1px solid var(--line);padding:56px 0 calc(28px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer h4{margin:0 0 12px;font-size:1rem}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;color:var(--mut)}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
footer p{color:var(--mut);margin:8px 0 0}
.cp{text-align:center;color:var(--mut);font-size:.9rem;margin-top:34px;grid-column:1/-1}
@media(max-width:820px){footer .wrap{grid-template-columns:1fr 1fr}}
.wa{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:99px;padding:13px 20px;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:30}
</style>
</head>
